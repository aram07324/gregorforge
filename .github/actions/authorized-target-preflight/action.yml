name: GregorForge authorized target preflight
description: Validate one HTTPS origin against an exact operator-maintained allowlist; does not scan.
inputs:
  target:
    description: HTTPS origin to validate
    required: true
  authorized-targets:
    description: JSON array of exact authorized HTTPS origins
    required: true
runs:
  using: composite
  steps:
    - name: Validate authorized target
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        AUTHORIZED_TARGETS: ${{ inputs.authorized-targets }}
      run: python "${{ github.action_path }}/../../../tools/github/authorize_target.py" --target "$TARGET" --authorized-targets "$AUTHORIZED_TARGETS"
