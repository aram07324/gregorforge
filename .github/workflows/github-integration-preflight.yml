name: GitHub integration preflight

on:
  pull_request:
    paths:
      - ".github/actions/authorized-target-preflight/**"
      - ".github/workflows/github-integration-preflight.yml"
      - "tools/github/**"
  workflow_dispatch:
    inputs:
      target:
        description: HTTPS origin to validate against the repository allowlist
        required: true
        type: string

permissions:
  contents: read

jobs:
  policy-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
      - name: Run target-policy tests
        run: python -m unittest discover -s tools/github -p "test_*.py" -v

  manual-target-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Validate configured authorized target
        uses: ./.github/actions/authorized-target-preflight
        with:
          target: ${{ inputs.target }}
          authorized-targets: ${{ vars.GREGORFORGE_AUTHORIZED_TARGETS }}
